# hyprlock — Catppuccin Mocha, Glass-Look passend zu hyprglass/quickshell.
# Liegt am hyprlock-Standardpfad ~/.config/hypr/hyprlock.conf (via Repo-Symlink).
#
# Layout (alle Monitore):
#        14:32          <- große Uhr
#   Samstag, 05. September
#
#      ( Passwort )     <- Pill-Eingabefeld, Mauve-Outline

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 3, default
    animation = fadeOut, 1, 3, default
    animation = inputFieldDots, 1, 2, default
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# --- Uhr -----------------------------------------------------------------
label {
    monitor =
    text = $TIME
    font_family = FiraCode Nerd Font
    font_size = 110
    color = rgb(cdd6f4)
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(11111b)
    position = 0, 220
    halign = center
    valign = center
}

# --- Datum (deutsch, aktualisiert minütlich) -----------------------------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B"
    font_family = FiraCode Nerd Font
    font_size = 22
    color = rgb(9399b2)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgb(11111b)
    position = 0, 120
    halign = center
    valign = center
}

# --- Eingabefeld ---------------------------------------------------------
input-field {
    monitor =
    size = 320, 56
    rounding = 28
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgb(cba6f7)
    inner_color = rgba(1e1e2ecc)
    font_color = rgb(cdd6f4)
    font_family = FiraCode Nerd Font

    check_color = rgb(eba0ac)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)

    placeholder_text = <span foreground="##6c7086">󰌾  Passwort ...</span>
    fail_text = <span foreground="##f38ba8">Falsch ($ATTEMPTS)</span>
    hide_input = false
    fade_on_empty = false

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(11111b)

    position = 0, -60
    halign = center
    valign = center
}
